<!-- public/logo.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.8" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D6" />
      <stop offset="50%" stop-color="#E6C687" />
      <stop offset="100%" stop-color="#B89753" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Aura -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.5" animation="spin 20s linear infinite"/>
  
  <!-- Conscious Sphere (Sfer) -->
  <circle cx="55" cy="55" r="32" fill="url(#cyanGlow)" filter="url(#glow)" />
  
  <!-- Subconscious Crescent (Luno) -->
  <path d="M78.5 28C63.3 22.8 45.8 26.6 34.6 37.8C20 52.4 20 76.1 34.6 90.7C46.5 102.6 65.2 105.8 80.3 97.4C69.6 102.7 56 101.4 46.6 92.1C33.3 78.8 33.3 57.2 46.6 43.9C57.4 33.2 73.1 30.6 85.3 37.2C83.2 33.8 81 30.8 78.5 28Z" fill="url(#goldGradient)" filter="url(#glow)"/>
  
  <!-- Inner Neural Star / Dream Seed -->
  <circle cx="68" cy="48" r="4" fill="#FFF6D6" filter="url(#glow)"/>
  <path d="M68 38 L69 46 L77 47 L69 49 L68 57 L67 49 L59 48 L67 46 Z" fill="#FFF6D6" opacity="0.8"/>
</svg>
